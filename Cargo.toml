[package]
name = "hwtrust"
version = "0.1.0"
edition = "2021"

[features]
default = []
std = [
    "base64/std",
    "ciborium/std",
    "coset/std",
    "itertools/use_std",
    "serde_json/std",
    "thiserror/std",
]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
ciborium = { version = "0.2.2", default-features = false }
clap = { version = "4.5", features = ["derive"] }
coset = { version = "0.3.8", default-features = false }
itertools = { version = "0.13.0", default-features = false, features = [
    "use_alloc",
] }
# TODO: replace with openssl-sys for no_std
openssl = { version = "0.10.68" }
serde_json = { version = "1.0.132", default-features = false, features = [
    "alloc",
] }
thiserror = { version = "2.0.3", default-features = false }

[dev-dependencies]
anyhow = "1"
